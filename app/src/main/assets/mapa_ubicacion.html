<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { font-family: sans-serif; }
        .leaflet-control-attribution { font-size: 10px !important; }
        #map-error {
            display: none; position: absolute; z-index: 1000; inset: 0;
            align-items: center; justify-content: center; padding: 24px;
            background: rgba(247, 246, 220, .92); color: #6e6a5a;
            text-align: center; font-size: 14px; pointer-events: none;
        }
    </style>
</head>
<body>
<div id="map" aria-label="Mapa para elegir la ubicación del salón"></div>
<div id="map-error">
    <div>No se pudo cargar el mapa. Revisa tu conexión a internet e inténtalo de nuevo.<br>
        <small>&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></small>
    </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
try {
    const params = new URLSearchParams(window.location.search);
    const isDetail = params.get('modo') === 'detalle';
    const latitude = Number(params.get('lat'));
    const longitude = Number(params.get('lon'));
    const hasCoordinates = Number.isFinite(latitude) && Number.isFinite(longitude);
    const initialPoint = isDetail && hasCoordinates
        ? [latitude, longitude]
        : [21.8818, -102.2916];

    const map = L.map('map', {
        zoomControl: !isDetail,
        dragging: !isDetail,
        scrollWheelZoom: !isDetail,
        doubleClickZoom: !isDetail,
        touchZoom: !isDetail,
        boxZoom: !isDetail,
        keyboard: !isDetail
    }).setView(initialPoint, isDetail ? 15 : 12);

    const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }).addTo(map);
    tiles.on('tileerror', () => {
        document.getElementById('map-error').style.display = 'flex';
    });

    let marker = null;
    if (isDetail && hasCoordinates) {
        marker = L.marker(initialPoint).addTo(map);
    }

    if (!isDetail) {
        map.on('click', (event) => {
            const point = event.latlng;
            if (marker) marker.setLatLng(point);
            else marker = L.marker(point).addTo(map);
            marker.bindPopup('Ubicación del salón').openPopup();
            if (window.AndroidBridge) {
                window.AndroidBridge.onLocationSelected(point.lat, point.lng);
            }
        });
    }

    setTimeout(() => map.invalidateSize(), 250);
} catch (error) {
    document.getElementById('map-error').style.display = 'flex';
}
</script>
</body>
</html>
